<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a href="{{ '/' | relative_url }}">
        <h1 class="wordmark">Inazira <span class="mark">Research</span></h1>
      </a>
      <p class="tagline">{{ site.description }}</p>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Articles</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>
    <hr class="rule">
  </div>

  <div class="wrap">
    {{ content }}
  </div>

  <div class="wrap">
    <footer class="site-footer">
      &copy; {{ 'now' | date: '%Y' }} Inazira Research
    </footer>
  </div>
</body>
</html>
